name: Build & Release Simple106

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            platform: linux
          - os: macos-14
            platform: macos
          - os: windows-latest
            platform: windows

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # --- LINUX DEPENDENCIES ---
      - name: Install Linux Dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake libasound2-dev libjack-jackd2-dev libgl1-mesa-dev libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libfreetype6-dev

      # --- CONFIGURE CMAKE ---
      - name: Configure CMake
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "macOS" ]; then
            cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" -DCMAKE_OSX_DEPLOYMENT_TARGET="10.13"
          else
            cmake -B build -DCMAKE_BUILD_TYPE=Release
          fi

      # --- BUILD TARGETS ---
      - name: Build Plugin & Standalone
        shell: bash
        run: cmake --build build --config Release --parallel

      # --- AD-HOC SIGNING (macOS) ---
      - name: Ad-hoc Code Sign (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          find build/Simple106_artefacts/Release -name "*.vst3" -exec codesign --force --deep -s - {} +
          find build/Simple106_artefacts/Release -name "*.component" -exec codesign --force --deep -s - {} +
          find build/Simple106_artefacts/Release -name "*.app" -exec codesign --force --deep -s - {} +

      # --- PACKAGE ARTIFACTS ---
      - name: Package Artifacts (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          mkdir -p package/Simple106-Linux
          cp -r build/Simple106_artefacts/Release/VST3/Simple106.vst3 package/Simple106-Linux/ || cp -r build/Simple106_artefacts/VST3/Simple106.vst3 package/Simple106-Linux/
          cp build/Simple106_artefacts/Release/Standalone/Simple106 package/Simple106-Linux/ || cp build/Simple106_artefacts/Standalone/Simple106 package/Simple106-Linux/
          cd package && zip -r ../Simple106-Linux-x64.zip Simple106-Linux

      - name: Package Artifacts (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          mkdir -p package/Simple106-macOS
          cp -r build/Simple106_artefacts/Release/VST3/Simple106.vst3 package/Simple106-macOS/
          cp -r build/Simple106_artefacts/Release/AU/Simple106.component package/Simple106-macOS/ || true
          cp -r build/Simple106_artefacts/Release/Standalone/Simple106.app package/Simple106-macOS/
          cd package && zip -r ../Simple106-macOS-Universal.zip Simple106-macOS

      - name: Package Artifacts (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          mkdir -p package/Simple106-Windows
          cp -r build/Simple106_artefacts/Release/VST3/Simple106.vst3 package/Simple106-Windows/
          cp build/Simple106_artefacts/Release/Standalone/Simple106.exe package/Simple106-Windows/
          cd package && 7z a ../Simple106-Windows-x64.zip Simple106-Windows

      # --- UPLOAD CI ARTIFACTS ---
      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Simple106-${{ matrix.platform }}
          path: Simple106-*.zip

  # --- AUTOMATED GITHUB RELEASES ON GIT TAG ---
  release:
    name: Create GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release_files

      - name: Move release files
        run: |
          mkdir -p final_release
          find release_files -name "*.zip" -exec cp {} final_release/ \;

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: final_release/*.zip
          name: Simple106 ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
